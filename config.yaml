universe:
  source: sec
  exclude_etfs: true
  min_price: 5.0

liquidity_gate:
  min_market_cap: 300000000
  min_avg_dollar_vol_20d: 5000000

quality_gate:
  gross_profitability_min: q25

factors:
  weights:
    # Price momentum block (0.50)
    # residual_mom replaces raw mom_12_1 as primary signal; mom_12_1 kept as secondary
    mom_12_1: 0.12
    residual_mom: 0.14
    rs_6m: 0.10
    rs_accel: 0.06
    rs_slope: 0.04
    pct_from_high: 0.04
    # Earnings/revision block (0.33)
    sue: 0.14
    rev_breadth: 0.10
    rev_magnitude: 0.09
    # Quality + insider block (0.09)
    gp_assets: 0.06
    insider_z: 0.03
    # Technical confirmation block (0.08) — rank-normalized, not z-scored
    trend_score: 0.05
    momo_osc_score: 0.02
    volume_score: 0.01
  winsorize_pct: 0.01
  missing_factor_treatment: neutral
  # Factors requiring rank-normalization instead of z-score (bounded integers)
  rank_normalize_factors:
    - insider_z
    - trend_score
    - momo_osc_score
    - volume_score
  # Minimum fraction of factor weight a stock must have data for to be scored
  min_factor_coverage: 0.40

streak:
  lookback_days: 14

confirmation:
  require_above_sma200: true
  max_pct_below_52w_high: 0.35

output:
  top_n: 20
  include_squeeze_screen: true
  # Rebalance band: hold until rank drops below exit_band
  entry_band: 20
  exit_band: 35

cache:
  price_ttl_hours: 18
  fundamentals_ttl_days: 7
  edgar_ttl_days: 30
  news_ttl_hours: 4

finnhub:
  calls_per_minute: 60

news:
  enabled: true
  analyze_top_n: 20

lazy_prices:
  # Neglect universe: capacity-constrained small/micro caps where arbitrage can't reach.
  # Market cap band deliberately avoids mega-caps already arbitraged by institutions.
  min_market_cap: 50000000      # $50M floor (exitable)
  max_market_cap: 2000000000    # $2B ceiling (below institutional capacity threshold)
  min_avg_dollar_vol_20d: 200000 # $200K tradeable floor (risk control)
  # Filing similarity
  similarity_threshold: 0.85   # below this → trigger Claude change-characterization
  filing_form: "10-K"
  filing_forms: ["10-K", "10-Q"]  # run both; annual + latest quarter (recency)
  filing_ttl_hours: 24
  # Text-similarity engine
  use_stopwords: true          # drop common English stopwords before cosine (widen dynamic range)
  jaccard_blend: 0.5           # section sim = blend*bigram_jaccard + (1-blend)*cosine
  # Parse-failure guard: a section similarity is treated as an extraction failure
  # (and ignored, falling back to doc-level sim) when the section sim is implausibly
  # low while the whole-document sim is near-identical.
  parse_fail_section_sim: 0.30
  parse_fail_doc_floor: 0.98
  # Filing recency: the "Lazy Prices" drift is an event signal anchored to filing date.
  max_filing_age_days: 120     # names filed longer ago than this are excluded from longs
  recency_halflife_days: 90    # exponential decay applied to composite as the filing ages
  # 8-K veto
  enable_8k_classifier: true   # scan recent 8-K items for material negative events
  eight_k_lookback_days: 180
  # Standalone composite weights (must sum to 1.0)
  weights:
    text_stability: 0.50   # primary "Lazy Prices" signal
    gp_assets: 0.20        # quality gate (avoid value traps)
    neglect_score: 0.15    # tilt toward less-covered names
    risk_growth: 0.15      # penalize risk-section word-count GROWTH (added risks = bearish)
  winsorize_pct: 0.02
  min_factor_coverage: 0.30
  # Output
  top_n: 30
  watch_list_n: 20  # deteriorating-language names to flag as avoid/watch
